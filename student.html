<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Your assignments - Greadter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Kalam:wght@400;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand-wrap"><time class="today" aria-label="Today's date"></time><div class="brand">Greadter</div></div>
  <nav><a href="index.html">Home</a></nav>
</header>
<main class="container">
  <details class="sec" open>
    <summary><span><span class="n">1</span>Choose a subject</span><span class="chev">›</span></summary>
    <div class="body"><div id="subjectGrid" class="rows"></div></div>
  </details>

  <details class="sec" open>
    <summary><span><span class="n">2</span>Choose a topic</span><span class="chev">›</span></summary>
    <div class="body"><div id="topicList"></div></div>
  </details>

  <details class="sec" open>
    <summary><span><span class="n">3</span>Upload your work</span><span class="chev">›</span></summary>
    <div class="body">
      <p class="lede" id="uploadTopicInfo"></p>
      <input id="stuName" placeholder="Name" readonly>
      <div class="formgrid">
        <div><input id="stuRoll" placeholder="Roll no." readonly></div>
        <div><input id="stuReg" placeholder="Reg. no." readonly></div>
      </div>
      <select id="stuDept" disabled>
        <option value="CSE">CSE</option>
        <option value="ME">ME</option>
        <option value="ECE">ECE</option>
        <option value="CE">CE</option>
      </select>
      <input type="file" id="fileInput" multiple accept=".pdf,.doc,.docx,.ppt,.pptx,.txt,.odt,.rtf">
      <div class="drop" id="dropZone">Drop files here, or click to choose</div>
      <div class="small muted">PDF, Word, PowerPoint, OpenDocument, RTF or TXT, up to 25 MB each.</div>
      <div id="fileList" class="small muted"></div>
      <div id="uploadMsg"></div>
      <div class="toolbar"><button class="btn primary" id="uploadBtn" disabled>Upload files</button></div>
    </div>
  </details>

  <details class="sec" open>
    <summary><span>Your marks</span><span class="chev">›</span></summary>
    <div class="body"><div id="marksheet"></div></div>
  </details>

  <details class="sec">
    <summary><span>Your submissions</span><span class="chev">›</span></summary>
    <div class="body"><div id="mySubs"></div></div>
  </details>

  <p class="note"><button class="linklike" id="logoutBtn">Log out</button></p>
</main>
<script src="js/auth.js"></script>
<script type="module">
  // Client uploads go through /api/upload, which issues a short-lived token.
  import { upload } from 'https://esm.sh/@vercel/blob@2.9.0/client';
  window.blobUpload = upload;
</script>
<script src="js/student.js"></script>
<script src="js/date.js" defer></script>
</body>
</html>
