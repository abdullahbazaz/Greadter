<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Greadter</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Greadter</div>
  <nav><a href="index.html">Home</a></nav>
</header>
<main class="container">
  <section class="hero" style="padding:32px 0 12px">
    <h1 style="font-size:34px">Admin panel</h1>
    <p class="small muted" style="margin-top:4px">Manage sections, teachers, subjects, and roster.</p>
  </section>

  <div class="hero-actions" style="justify-content:center; margin-top:24px;">
    <div style="max-width:640px; margin:0 auto; background:#fff; border:1px solid #eee; border-radius:12px; padding:24px; box-shadow:0 2px 8px rgba(0,0,0,0.04);">

      <!-- Departments -->
      <div style="margin-bottom:24px; padding-bottom:20px; border-bottom:1px solid #f5f5f5;">
        <h3 style="margin:0 0 12px 0; font-size:18px;">Departments</h3>
        <div class="formgrid" style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:12px;">
          <div><input id="depName" placeholder="Department name (e.g. Computer Science)"></div>
          <div><input id="depCode" placeholder="Code (e.g. CSE)"></div>
        </div>
        <div class="toolbar" style="justify-content:flex-start;"><button class="btn primary" id="addDepBtn">Add department</button></div>
        <div id="departmentList" class="rows" style="margin-top:12px;"></div>
      </div>

      <!-- Sections -->
      <div style="margin-bottom:24px; padding-bottom:20px; border-bottom:1px solid #f5f5f5;">
        <h3 style="margin:0 0 12px 0; font-size:18px;">Sections</h3>
        <div class="formgrid" style="display:grid; grid-template-columns:1fr 1fr auto; gap:8px; margin-bottom:12px; align-items:end;">
          <div><select id="secDep"></select></div>
          <div><input id="secName" placeholder="Section name (e.g. Section A)"></div>
          <div><button class="btn primary" id="addSecBtn">Add section</button></div>
        </div>
        <div id="sectionList" class="rows" style="margin-top:12px;"></div>
      </div>

      <!-- Pending teachers -->
      <div style="margin-bottom:24px; padding-bottom:20px; border-bottom:1px solid #f5f5f5;">
        <h3 style="margin:0 0 12px 0; font-size:18px;">Pending teachers</h3>
        <p class="small muted" style="margin:0 0 12px 0;">Teachers awaiting approval.</p>
        <div id="pendingTeachers" class="rows"></div>
      </div>

      <!-- Teachers & sections -->
      <div style="margin-bottom:24px; padding-bottom:20px; border-bottom:1px solid #f5f5f5;">
        <h3 style="margin:0 0 12px 0; font-size:18px;">Teachers &amp; sections</h3>
        <div id="teacherList"></div>
      </div>

      <!-- Subjects -->
      <div style="margin-bottom:24px; padding-bottom:20px; border-bottom:1px solid #f5f5f5;">
        <h3 style="margin:0 0 12px 0; font-size:18px;">Subjects</h3>
        <div class="formgrid" style="display:grid; grid-template-columns:1fr auto auto auto; gap:8px; margin-bottom:12px; align-items:end;">
          <div><select id="subjSec"></select></div>
          <div><input id="subjName" placeholder="New subject"></div>
          <div><input id="subjCode" placeholder="Code"></div>
          <div><button class="btn primary" id="addSubjBtn">Add subject</button></div>
        </div>
        <div id="subjectList"></div>
      </div>

      <!-- Student roster -->
      <div style="margin-bottom:24px; padding-bottom:20px; border-bottom:1px solid #f5f5f5;">
        <h3 style="margin:0 0 12px 0; font-size:18px;">Student roster</h3>
        <p class="small muted" style="margin:0 0 12px 0;">Upload CSV: reg_no, name, roll_no, dept, email, section_id</p>
        <input type="file" id="rosterFile" accept=".csv" style="margin-bottom:12px; display:block; width:100%;">
        <div class="toolbar" style="justify-content:flex-start;"><button class="btn primary" id="importRoster">Import roster</button></div>
        <div id="rosterList" class="rows" style="margin-top:12px;"></div>
      </div>

      <!-- Accounts -->
      <div style="margin-bottom:0;">
        <h3 style="margin:0 0 12px 0; font-size:18px;">Accounts</h3>
        <div id="accountList"></div>
      </div>

    </div>
  </div>

  <p class="note" style="text-align:center; margin-top:24px;"><a class="link" href="index.html">← Back to home</a></p>
</main>

<script>
const raw = localStorage.getItem("greadter_session_v1");
if(!raw){ location.href = "login.html?role=admin"; }
const sess = JSON.parse(raw);
if(sess.userType !== "admin"){ location.href = "login.html?role=admin"; }
</script>
<script src="js/data.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
