<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Admin log in - Greadter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Kalam:wght@400;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Greadter</div>
  <nav><a href="index.html">Home</a></nav>
</header>
<main class="container">
  <section class="hero">
    <h1>Admin log in</h1>
  </section>

  <div class="form-col"><div>
      <input id="admEmail" placeholder="Admin email" autocomplete="off">
      <input id="admPass" type="password" placeholder="Password" autocomplete="current-password">
      <div class="toolbar"><button class="btn primary" id="loginAdmin">Log in</button></div>
    </div>
  </div>
</main>
<script src="js/auth.js"></script>
<script>
const admEmail = $("admEmail"), admPass = $("admPass"), loginAdminBtn = $("loginAdmin");
function checkLogin(){ loginAdminBtn.disabled = !(admEmail.value.trim() && admPass.value.trim()); }
admEmail.addEventListener("input", checkLogin);
admPass.addEventListener("input", checkLogin);
checkLogin();
$("loginAdmin").onclick = async ()=>{
  const r = await loginAdmin(admEmail.value, admPass.value);
  if(r.ok){ location.href = r.redirect; } else { alert(r.msg); }
};
</script>
</body>
</html>
