<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teacher Signup — Greadter</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Greadter</div>
  <nav><a href="index.html">Home</a></nav>
</header>
<main class="container">
  <section class="hero" style="padding:32px 0 12px">
    <h1 style="font-size:34px">Teacher Signup</h1>
    <p class="small muted" style="margin-top:8px">University email only. Account is created as pending until an admin approves it.</p>
  </section>

  <div class="hero-actions" style="justify-content:center; margin-top:24px">
    <div style="max-width:360px; margin:0 auto">
      <input id="tName" placeholder="Full name" autocomplete="off">
      <input id="tDept" placeholder="Department" autocomplete="off">
      <input id="tEmail" type="email" placeholder="University email" autocomplete="off">
      <input id="tPass" type="password" placeholder="Password" autocomplete="new-password">
      <div class="toolbar" style="justify-content:center"><button class="btn primary" id="signupTeacher">Create account</button></div>
      <p class="small muted" style="margin-top:12px">Already have an account? <a class="link" href="teacher-login.html">Log in →</a></p>
    </div>
  </div>
</main>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script>
$("signupTeacher").onclick = async ()=>{
  const r = await signupTeacher({
    name: $("tName").value.trim(), dept: $("tDept").value.trim(),
    email: $("tEmail").value.trim(), pass: $("tPass").value.trim()
  });
  if(r.ok){ alert(r.msg); location.href="teacher-login.html"; } else { alert(r.msg); }
};
</script>
</body>
</html>
