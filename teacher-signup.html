<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Teacher sign up - Greadter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Kalam:wght@400;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Greadter</div>
  <nav><a href="index.html">Home</a></nav>
</header>
<main class="container">
  <section class="hero">
    <h1>Teacher sign up</h1>
    <p class="small muted">University email only. Account is created as pending until an admin approves it.</p>
  </section>

  <div class="form-col"><div>
      <input id="tName" placeholder="Full name" autocomplete="off">
      <input id="tDept" placeholder="Department" autocomplete="off">
      <input id="tEmail" type="email" placeholder="University email" autocomplete="off">
      <input id="tPass" type="password" placeholder="Password (min. 8 characters)" minlength="8" autocomplete="new-password">
      <div class="toolbar"><button class="btn primary" id="signupTeacher">Create account</button></div>
      <p class="small muted">Already have an account? <a class="link" href="teacher-login.html">Log in</a></p>
    </div>
  </div>
</main>
<script src="js/auth.js"></script>
<script>
const tName = $("tName"), tDept = $("tDept"), tEmail = $("tEmail"), tPass = $("tPass"), signupTeacherBtn = $("signupTeacher");
function checkSignup(){ signupTeacherBtn.disabled = !(tName.value.trim() && tDept.value.trim() && tEmail.value.trim() && tPass.value.trim()); }
[tName,tDept,tEmail,tPass].forEach(el=>el.addEventListener("input", checkSignup));
checkSignup();
$("signupTeacher").onclick = async ()=>{
  const r = await signupTeacher({
    name: tName.value.trim(), dept: tDept.value.trim(),
    email: tEmail.value.trim(), pass: tPass.value.trim()
  });
  if(r.ok){ alert(r.msg); location.href="teacher-login.html"; } else { alert(r.msg); }
};
</script>
</body>
</html>
