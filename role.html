<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Greadter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Kalam:wght@400;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Greadter</div>
  <nav><a href="index.html">Home</a></nav>
</header>
<main class="container">
  <section class="hero">
    <h1 id="roleTitle">Students</h1>
    <p id="roleSub">Log in if you already have an account, or sign up to create one.</p>
    <div class="hero-actions">
      <a class="btn primary" id="btnLogin" href="student-login.html">Log in</a>
      <a class="btn" id="btnSignup" href="student-signup.html">Sign up</a>
    </div>
  </section>
</main>
<script>
const role = new URLSearchParams(location.search).get('role');
const pages = {
  student: { title: 'Students', sub: 'Log in if you already have an account, or sign up with your registration number.', login: 'student-login.html', signup: 'student-signup.html' },
  teacher: { title: 'Teachers', sub: 'Log in, or sign up with your university email. An admin approves new teacher accounts.', login: 'teacher-login.html', signup: 'teacher-signup.html' },
  admin:   { title: 'Admins', sub: 'Log in to manage departments, sections, teachers and the student roster.', login: 'admin-login.html', signup: 'admin-signup.html' },
};
const p = pages[role] || pages.student;
document.getElementById('roleTitle').textContent = p.title;
document.getElementById('roleSub').textContent = p.sub;
document.getElementById('btnLogin').href = p.login;
document.getElementById('btnSignup').href = p.signup;
document.title = `${p.title} - Greadter`;
</script>
</body>
</html>
