<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Greadter — Role</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Greadter</div>
  <nav><a href="index.html">Back</a></nav>
</header>
<main class="container">
  <section class="hero" style="padding:32px 0 12px">
    <h1 id="roleTitle" style="font-size:34px">Student</h1>
    <p id="roleSub" style="margin-top:8px">Choose how to continue.</p>
  </section>

  <div class="hero-actions" style="justify-content:center; gap:20px; margin-top:24px">
    <a class="btn primary" id="btnLogin" href="#" style="padding:14px 36px; font-size:16px">Student Login</a>
    <a class="btn" id="btnSignup" href="#" style="padding:14px 36px; font-size:16px">Student Signup</a>
  </div>
</main>
<script>
const params = new URLSearchParams(location.search);
const role = params.get('role') || 'student';
const title = document.getElementById('roleTitle');
const sub = document.getElementById('roleSub');
const btnLogin = document.getElementById('btnLogin');
const btnSignup = document.getElementById('btnSignup');

if(role === 'teacher'){
  title.textContent = 'Teacher';
  sub.textContent = 'Choose how to continue.';
  btnLogin.textContent = 'Teacher Login';
  btnSignup.textContent = 'Teacher Signup';
  btnLogin.href = 'login.html?role=teacher';
  btnSignup.href = 'signup.html?role=teacher';
} else {
  title.textContent = 'Student';
  sub.textContent = 'Choose how to continue.';
  btnLogin.textContent = 'Student Login';
  btnSignup.textContent = 'Student Signup';
  btnLogin.href = 'login.html?role=student';
  btnSignup.href = 'signup.html?role=student';
}
</script>
</body>
</html>
