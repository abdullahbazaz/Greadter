<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Teacher log in - Greadter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Kalam:wght@400;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand-wrap"><time class="today" aria-label="Today's date"></time><div class="brand">Greadter</div></div>
  <nav><a href="index.html">Home</a></nav>
</header>
<main class="container">
  <section class="hero">
    <h1>Teacher log in</h1>
  </section>

  <div class="form-col"><div>
      <input id="tchEmail" placeholder="University email" autocomplete="off">
      <input id="tchPass" type="password" placeholder="Password" autocomplete="current-password">
      <div class="toolbar"><button class="btn primary" id="loginTeacher">Log in</button></div>
      <p class="small muted">New teacher? <a class="link" href="teacher-signup.html">Sign up</a></p>
    </div>
  </div>
</main>
<script src="js/auth.js"></script>
<script>
const tchEmail = $("tchEmail"), tchPass = $("tchPass"), loginTeacher = $("loginTeacher");
function checkLogin(){ loginTeacher.disabled = !(tchEmail.value.trim() && tchPass.value.trim()); }
tchEmail.addEventListener("input", checkLogin);
tchPass.addEventListener("input", checkLogin);
checkLogin();
$("loginTeacher").onclick = async ()=>{
  const r = await attemptLogin(tchEmail.value, tchPass.value, "teacher");
  if(r.ok){ location.href = r.redirect; } else { alert(r.msg); }
};
</script>
<script src="js/date.js" defer></script>
</body>
</html>
