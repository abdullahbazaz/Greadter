<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Log in - Greadter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Kalam:wght@400;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand-wrap"><time class="today" aria-label="Today's date"></time><div class="brand">Greadter</div></div>
  <nav><a href="index.html">Home</a></nav>
</header>
<main class="container">
  <section class="hero">
    <h1>Log in</h1>
  </section>

  <details class="sec" id="sec-student">
    <summary><span>Student</span><span class="chev">›</span></summary>
    <div class="body">
      <input id="stuReg" placeholder="Registration no." autocomplete="off">
      <input id="stuPass" type="password" placeholder="Password" autocomplete="current-password">
      <div class="toolbar"><button class="btn primary" id="loginStudent">Log in</button></div>
      <p class="small muted">New student? <a class="link" href="signup.html?role=student">Sign up</a></p>
    </div>
  </details>

  <details class="sec" id="sec-teacher">
    <summary><span>Teacher</span><span class="chev">›</span></summary>
    <div class="body">
      <input id="tchEmail" placeholder="University email" autocomplete="off">
      <input id="tchPass" type="password" placeholder="Password" autocomplete="current-password">
      <div class="toolbar"><button class="btn primary" id="loginTeacher">Log in</button></div>
      <p class="small muted">New teacher? <a class="link" href="signup.html?role=teacher">Sign up</a></p>
    </div>
  </details>

  <details class="sec" id="sec-admin">
    <summary><span>Admin</span><span class="chev">›</span></summary>
    <div class="body">
      <input id="admEmail" placeholder="Admin email" autocomplete="off">
      <input id="admPass" type="password" placeholder="Password" autocomplete="current-password">
      <div class="toolbar"><button class="btn primary" id="loginAdmin">Log in</button></div>
    </div>
  </details>

  <p class="note"><a class="link" href="index.html">Back to home</a></p>
</main>
<script src="js/auth.js"></script>
<script>
// Validation: student login
const sReg = $("stuReg"), sPass = $("stuPass"), sBtn = $("loginStudent");
function chkStudent(){ sBtn.disabled = !(sReg.value.trim() && sPass.value.trim()); }
[sReg,sPass].forEach(el=>el.addEventListener("input", chkStudent));
chkStudent();

// Validation: teacher login
const tEmail = $("tchEmail"), tPass = $("tchPass"), tBtn = $("loginTeacher");
function chkTeacher(){ tBtn.disabled = !(tEmail.value.trim() && tPass.value.trim()); }
[tEmail,tPass].forEach(el=>el.addEventListener("input", chkTeacher));
chkTeacher();

// Validation: admin login
const aEmail = $("admEmail"), aPass = $("admPass"), aBtn = $("loginAdmin");
function chkAdmin(){ aBtn.disabled = !(aEmail.value.trim() && aPass.value.trim()); }
[aEmail,aPass].forEach(el=>el.addEventListener("input", chkAdmin));
chkAdmin();

$("loginStudent").onclick = async ()=>{
  const r = await attemptLogin(sReg.value, sPass.value, "student");
  if(r.ok){ location.href = r.redirect; } else { alert(r.msg); }
};
$("loginTeacher").onclick = async ()=>{
  const r = await attemptLogin(tEmail.value, tPass.value, "teacher");
  if(r.ok){ location.href = r.redirect; } else { alert(r.msg); }
};
$("loginAdmin").onclick = async ()=>{
  const r = await loginAdmin(aEmail.value, aPass.value);
  if(r.ok){ location.href = r.redirect; } else { alert(r.msg); }
};

// Auto-open selected role section and hide others
const params = new URLSearchParams(location.search);
const role = params.get('role');

const secStudent = document.getElementById('sec-student');
const secTeacher = document.getElementById('sec-teacher');
const secAdmin = document.getElementById('sec-admin');

function showOnly(id){
  secStudent.style.display = id === 'sec-student' ? '' : 'none';
  secTeacher.style.display = id === 'sec-teacher' ? '' : 'none';
  secAdmin.style.display   = id === 'sec-admin'   ? '' : 'none';
}

if(role === 'student'){
  showOnly('sec-student');
  secStudent.open = true;
  secTeacher.open = false;
  secAdmin.open = false;
} else if(role === 'teacher'){
  showOnly('sec-teacher');
  secTeacher.open = true;
  secStudent.open = false;
  secAdmin.open = false;
} else if(role === 'admin'){
  showOnly('sec-admin');
  secAdmin.open = true;
  secStudent.open = false;
  secTeacher.open = false;
}
</script>
<script src="js/date.js" defer></script>
</body>
</html>
