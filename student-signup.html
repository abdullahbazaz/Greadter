<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Student sign up - Greadter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Kalam:wght@400;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Greadter</div>
  <nav><a href="index.html">Home</a></nav>
</header>
<main class="container">
  <section class="hero">
    <h1>Student sign up</h1>
    <p class="small muted">Fill in the fields from the top. Your department, admission year and section put you in the right class.</p>
  </section>

  <div class="form-col"><div>
      <label>Registration no. <span class="small muted">(type first)</span></label>
      <input id="sReg" placeholder="e.g. REG001" autocomplete="off">

      <label>Department</label>
      <select id="sDept" disabled>
        <option value="">Select department</option>
        <option value="CSE">CSE</option>
        <option value="ME">ME</option>
        <option value="ECE">ECE</option>
        <option value="CE">CE</option>
      </select>

      <label>Admission year</label>
      <select id="sYear" disabled>
        <option value="">Select admission year</option>
      </select>

      <label>Roll no.</label>
      <div class="roll-wrapper">
        <span id="rollPrefix" class="roll-prefix"></span>
        <input id="sRoll" type="text" placeholder="101" disabled maxlength="10" autocomplete="off">
      </div>

      <label>Section</label>
      <select id="sSection" disabled>
        <option value="">Select section</option>
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
      </select>

      <label>Full name</label>
      <input id="sName" placeholder="Full name" autocomplete="off">

      <label>University email</label>
      <input id="sEmail" type="email" placeholder="name@college.edu" autocomplete="off">

      <label>Password</label>
      <input id="sPass" type="password" placeholder="Password (min. 8 characters)" minlength="8" autocomplete="new-password">

      <div id="verifyMsg" class="small muted"></div>
      <div class="toolbar"><button class="btn primary" id="signupStudent" disabled>Create account</button></div>
      <p class="small muted">Already have an account? <a class="link" href="student-login.html">Log in</a></p>
    </div>
  </div>
</main>
<script src="js/auth.js"></script>
<script>
const sReg = document.getElementById('sReg');
const sDept = document.getElementById('sDept');
const sYear = document.getElementById('sYear');
// Admission years currently studying (semesters 1–8), labelled with their semester.
activeBatches().forEach(y=>{ const o=document.createElement('option'); o.value=String(y).slice(2); o.textContent=`${y} (${semesterText(y)})`; sYear.appendChild(o); });
const sRoll = document.getElementById('sRoll');
const sSection = document.getElementById('sSection');
const rollPrefix = document.getElementById('rollPrefix');
const verifyMsg = document.getElementById('verifyMsg');
const signupBtn = document.getElementById('signupStudent');
const sName = $('sName'), sEmail = $('sEmail'), sPass = $('sPass');

const deptPrefixMap = { CSE: 'CSE', ME: 'ME', ECE: 'ECE', CE: 'CE' };

function updateRollPrefix(){
  const dept = sDept.value; const year = sYear.value;
  if(dept && year){ rollPrefix.textContent = deptPrefixMap[dept] + '-' + year + '-'; sRoll.disabled = false; sRoll.focus(); }
  else { rollPrefix.textContent = ''; sRoll.disabled = true; sRoll.value = ''; }
}

function canSubmit(){
  return !!(
    sReg.value.trim() && sDept.value && sYear.value && sRoll.value.trim() &&
    sSection.value && sName.value.trim() && sEmail.value.trim() && sPass.value.trim()
  );
}

function checkForm(){ signupBtn.disabled = !canSubmit(); verifyMsg.textContent = ''; }

sReg.addEventListener('input', ()=>{
  sDept.disabled = !sReg.value.trim();
  if(!sReg.value.trim()){ sDept.value=''; sYear.value=''; sRoll.value=''; sSection.value=''; rollPrefix.textContent=''; sDept.disabled=true; sYear.disabled=true; sRoll.disabled=true; sSection.disabled=true; }
  checkForm();
});

sDept.addEventListener('change', ()=>{
  sYear.disabled = !sDept.value;
  if(!sDept.value){ sYear.value=''; sRoll.value=''; sSection.value=''; rollPrefix.textContent=''; sYear.disabled=true; sRoll.disabled=true; sSection.disabled=true; }
  else { sYear.disabled=false; }
  updateRollPrefix(); checkForm();
});

sYear.addEventListener('change', updateRollPrefix);
sRoll.addEventListener('input', checkForm);
sSection.addEventListener('change', checkForm);
sName.addEventListener('input', checkForm);
sEmail.addEventListener('input', checkForm);
sPass.addEventListener('input', checkForm);

signupBtn.addEventListener('click', async (e)=>{
  e.preventDefault();
  const reg = sReg.value.trim(); const dept = sDept.value; const year = sYear.value;
  const rollSuffix = sRoll.value.trim(); const roll = dept + '-' + year + '-' + rollSuffix;
  const section = sSection.value; const name = sName.value.trim(); const email = sEmail.value.trim(); const pass = sPass.value.trim();

  verifyMsg.textContent = "Creating account...";
  verifyMsg.style.color = 'var(--pencil)';

  const r = await signupStudent({name, roll, reg, dept, email, pass, section, year});
  if(r.ok){ verifyMsg.textContent = r.msg; verifyMsg.style.color = 'var(--green)'; signupBtn.disabled = true; setTimeout(()=>location.href="student-login.html", 1200); }
  else { verifyMsg.textContent = r.msg; verifyMsg.style.color = 'var(--red)'; }
});
</script>
</body>
</html>
