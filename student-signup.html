<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Student sign up - Greadter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Kalam:wght@400;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand-wrap"><time class="today" aria-label="Today's date"></time><div class="brand">Greadter</div></div>
  <nav><a href="index.html">Home</a></nav>
</header>
<main class="container">
  <section class="hero">
    <h1>Student sign up</h1>
    <p>Only students on the class roster can sign up. Start with the registration number on your student ID.</p>
  </section>

  <div class="form-col">
    <form id="findForm" novalidate>
      <label for="sReg">Registration number</label>
      <input id="sReg" name="reg" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="e.g. REG25001" required>
      <div class="toolbar"><button class="btn primary" id="findBtn" type="submit">Find my record</button></div>
      <div id="findMsg" role="status" aria-live="polite"></div>
    </form>

    <form id="createForm" novalidate hidden>
      <div class="record" id="record" tabindex="-1">
        <h2>Is this you?</h2>
        <dl>
          <dt>Name</dt><dd id="rName"></dd>
          <dt>Registration no.</dt><dd id="rReg"></dd>
          <dt>Department</dt><dd id="rDept"></dd>
          <dt>Class</dt><dd id="rClass"></dd>
        </dl>
      </div>
      <p class="small"><button class="linklike" id="notMe" type="button">Not you? Use a different number</button></p>

      <label for="sRoll">Roll number</label>
      <input id="sRoll" name="roll" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="As on your roster, e.g. CSE-25-101" required>
      <label for="sEmail">Email</label>
      <input id="sEmail" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      <label for="sPass">Password</label>
      <input id="sPass" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required>
      <div class="toolbar"><button class="btn primary" id="createBtn" type="submit">Create account</button></div>
      <div id="createMsg" role="status" aria-live="polite"></div>
    </form>

    <p class="small muted">Already have an account? <a class="link" href="student-login.html">Log in</a></p>
  </div>
</main>
<script src="js/auth.js"></script>
<script>
let found = null;   // the roster record for the number entered

function say(box, text, kind){ $(box).innerHTML = text ? `<div class="alert ${kind || ""}">${esc(text)}</div>` : ""; }

function classLabel(r){
  const parts = [];
  if(r.section) parts.push(`Section ${r.section}`);
  if(r.batch_year) parts.push(`admitted ${r.batch_year}`);
  const sem = r.batch_year ? semesterText(r.batch_year) : "";
  return parts.join(", ") + (sem ? ` (${sem.replace("Sem", "semester")})` : "") || "Not assigned to a section yet";
}

$("findForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const reg = $("sReg").value.trim();
  if(!reg){ say("findMsg", "Enter your registration number.", "bad"); $("sReg").focus(); return; }
  $("findBtn").disabled = true; say("findMsg", "Checking the roster…");
  const r = await postJSON("/roster", { reg_no: reg });
  $("findBtn").disabled = false;
  if(!r.ok){ say("findMsg", r.error || "Couldn't check the roster. Try again.", "bad"); return; }
  if(r.claimed){
    $("findMsg").innerHTML = `<div class="alert">This registration number already has an account. <a class="link" href="student-login.html">Log in</a> instead.</div>`;
    return;
  }
  found = r;
  say("findMsg", "");
  $("rName").textContent = r.masked_name || "—";
  $("rReg").textContent = r.reg_no;
  $("rDept").textContent = r.dept || "—";
  $("rClass").textContent = classLabel(r);
  $("findForm").hidden = true; $("createForm").hidden = false;
  $("sRoll").focus();
});

$("notMe").onclick = ()=>{
  found = null; say("createMsg", "");
  $("createForm").hidden = true; $("findForm").hidden = false;
  $("sReg").select(); $("sReg").focus();
};

$("createForm").addEventListener("submit", async e=>{
  e.preventDefault();
  const roll = $("sRoll").value.trim(), email = $("sEmail").value.trim(), pass = $("sPass").value;
  if(!roll){ say("createMsg", "Enter your roll number.", "bad"); $("sRoll").focus(); return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ say("createMsg", "Enter a valid email address.", "bad"); $("sEmail").focus(); return; }
  if(pass.length < 8){ say("createMsg", "Use at least 8 characters for your password.", "bad"); $("sPass").focus(); return; }
  $("createBtn").disabled = true; say("createMsg", "Creating your account…");
  const r = await signupStudent({ reg: found.reg_no, roll, email, pass });
  if(!r.ok){ $("createBtn").disabled = false; say("createMsg", r.msg, "bad"); return; }
  say("createMsg", "Account created. Taking you to log in…", "ok");
  setTimeout(()=>location.href = "student-login.html", 1200);
});
</script>
<script src="js/date.js" defer></script>
</body>
</html>
