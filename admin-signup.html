<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Admin sign up - Greadter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Kalam:wght@400;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand-wrap"><time class="today" aria-label="Today's date"></time><div class="brand">Greadter</div></div>
  <nav><a href="index.html">Home</a></nav>
</header>
<main class="container">
  <section class="hero">
    <h1>Admin sign up</h1>
  </section>

  <div class="form-col"><div>
      <input id="aName" placeholder="Full name" autocomplete="off">
      <input id="aEmail" type="email" placeholder="Admin email" autocomplete="off">
      <input id="aPass" type="password" placeholder="Password (min. 8 characters)" minlength="8" autocomplete="new-password">
      <div class="toolbar"><button class="btn primary" id="signupAdmin">Create account</button></div>
    </div>
  </div>
</main>
<script src="js/auth.js"></script>
<script>
const aName = $("aName"), aEmail = $("aEmail"), aPass = $("aPass"), signupAdminBtn = $("signupAdmin");
function checkSignup(){ signupAdminBtn.disabled = !(aName.value.trim() && aEmail.value.trim() && aPass.value.trim()); }
[aName,aEmail,aPass].forEach(el=>el.addEventListener("input", checkSignup));
checkSignup();
$("signupAdmin").onclick = async ()=>{
  const r = await signupAdmin({
    name: aName.value.trim(),
    email: aEmail.value.trim(), pass: aPass.value.trim()
  });
  if(r.ok){ alert(r.msg); location.href="admin-login.html"; } else { alert(r.msg); }
};
</script>
<script src="js/date.js" defer></script>
</body>
</html>
