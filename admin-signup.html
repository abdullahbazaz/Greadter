<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Signup — Greadter</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Greadter</div>
  <nav><a href="index.html">Home</a></nav>
</header>
<main class="container">
  <section class="hero" style="padding:32px 0 12px">
    <h1 style="font-size:34px">Admin Signup</h1>
  </section>

  <div class="hero-actions" style="justify-content:center; margin-top:24px">
    <div style="max-width:360px; margin:0 auto">
      <input id="aName" placeholder="Full name" autocomplete="off">
      <input id="aDept" placeholder="Department" autocomplete="off">
      <input id="aEmail" type="email" placeholder="Admin email" autocomplete="off">
      <input id="aPass" type="password" placeholder="Password" autocomplete="new-password">
      <div class="toolbar" style="justify-content:center"><button class="btn primary" id="signupAdmin">Create account</button></div>
    </div>
  </div>
</main>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script>
$("signupAdmin").onclick = async ()=>{
  const r = await signupAdmin({
    name: $("aName").value.trim(), dept: $("aDept").value.trim(),
    email: $("aEmail").value.trim(), pass: $("aPass").value.trim()
  });
  if(r.ok){ alert(r.msg); location.href="admin-login.html"; } else { alert(r.msg); }
};
</script>
</body>
</html>
