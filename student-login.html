<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Student log in - Greadter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Kalam:wght@400;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Greadter</div>
  <nav><a href="index.html">Home</a></nav>
</header>
<main class="container">
  <section class="hero">
    <h1>Student log in</h1>
  </section>

  <div class="form-col"><div>
      <input id="stuReg" placeholder="Registration no." autocomplete="off">
      <input id="stuPass" type="password" placeholder="Password" autocomplete="current-password">
      <div class="toolbar"><button class="btn primary" id="loginStudent">Log in</button></div>
      <p class="small muted">New student? <a class="link" href="student-signup.html">Sign up</a></p>
    </div>
  </div>
</main>
<script src="js/auth.js"></script>
<script>
const stuReg = $("stuReg"), stuPass = $("stuPass"), loginStudent = $("loginStudent");
function checkLogin(){ loginStudent.disabled = !(stuReg.value.trim() && stuPass.value.trim()); }
stuReg.addEventListener("input", checkLogin);
stuPass.addEventListener("input", checkLogin);
checkLogin();
$("loginStudent").onclick = async ()=>{
  const r = await attemptLogin(stuReg.value, stuPass.value, "student");
  if(r.ok){ location.href = r.redirect; } else { alert(r.msg); }
};
</script>
</body>
</html>
